name: Package release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build ZIP and create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate release version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.version' manifest.json)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.][0-9]+)?$ ]]; then
            echo "Invalid Chrome extension version: ${version}" >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Ensure the version has not been released
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists. Bump manifest.json before publishing again." >&2
            exit 1
          fi

      - name: Build extension ZIP
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/package"
          asset="dist/hidden-reactions-for-facebook-v${VERSION}.zip"

          mkdir -p "$package_dir"
          cp \
            manifest.json \
            popup.html \
            popup.js \
            popup.css \
            content.js \
            content.css \
            stats-worker.js \
            icon16.png \
            icon48.png \
            icon128.png \
            "$package_dir/"
          cp -R _locales "$package_dir/"

          (
            cd "$package_dir"
            zip -r "../$(basename "$asset")" .
          )

          unzip -l "$asset"

      - name: Create release notes from commit message
        shell: bash
        run: |
          set -euo pipefail
          git show -s --format=%B "$GITHUB_SHA" > dist/release-notes.md

      - name: Create GitHub Release and upload ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create \
            "$RELEASE_TAG" \
            "dist/hidden-reactions-for-facebook-v${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file dist/release-notes.md
